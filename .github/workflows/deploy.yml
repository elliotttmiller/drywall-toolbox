name: Deploy to Shopify Oxygen

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Oxygen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Hydrogen app
        run: npm run build
        env:
          PUBLIC_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_API_TOKEN }}
          PRIVATE_STOREFRONT_API_TOKEN: ${{ secrets.SHOPIFY_PRIVATE_STOREFRONT_TOKEN }}
          PUBLIC_STOREFRONT_API_VERSION: '2024-10'
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}

      - name: Deploy to Oxygen
        uses: shopify/oxygenctl-action@v1
        with:
          oxygen-deployment-token: ${{ secrets.OXYGEN_DEPLOYMENT_TOKEN }}
          path: ./build/worker
