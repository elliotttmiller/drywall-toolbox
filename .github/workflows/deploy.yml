name: Deploy to HostGator (WordPress + ReactPress)

on:
  push:
    branches:
      - main
    paths:
      - 'wp/wp-content/**'
      - 'reactpress-app/**'
  workflow_dispatch:

jobs:
  # ─── Job 1: Deploy WordPress theme & plugin ──────────────────────────────
  deploy-wordpress:
    name: Deploy WordPress Theme & Plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate wp-content structure
        run: |
          echo "PWD=$(pwd)"
          echo "-- root files --"
          ls -la
          echo "-- wp folder --"
          ls -la wp || true
          echo "-- wp/wp-content --"
          ls -la wp/wp-content || true
          echo "-- themes --"
          ls -la wp/wp-content/themes || true
          echo "-- plugins --"
          ls -la wp/wp-content/plugins || true

      - name: Deploy themes and plugins via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASS }}
          protocol: ftps
          port: 21
          # server-dir must match the FTP account's document-root on HostGator.
          # If the FTP account's home is the cPanel user home directory, use
          # /public_html/wp-content/.  If the FTP account's home is already
          # public_html/, use /wp-content/. Adjust to match your cPanel setup.
          server-dir: /public_html/wp-content/
          local-dir: ./wp/wp-content/
          exclude: |
            **/.git*
            **/.github/**
            **/node_modules/**
            **/*.log
            **/.env*
            **/.gitignore
            **/README.md
            **/twentytwenty*/**
            **/yith-wonder/**
            **/*.bak
          dangerous-clean-slate: false
          log-level: verbose
          dry-run: false
          timeout: 60000

      - name: WordPress deployment complete
        if: always()
        run: echo "✓ WordPress assets deployed to HostGator at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

  # ─── Job 2: Build React app and deploy to ReactPress directory ────────────
  deploy-reactpress:
    name: Build & Deploy ReactPress App (contacts)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: reactpress-app/package-lock.json

      - name: Install dependencies
        working-directory: reactpress-app
        run: npm ci

      - name: Build React app (Vite)
        working-directory: reactpress-app
        run: npm run build
        # Produces reactpress-app/dist/ with assets rooted at
        # /wp-content/reactpress/apps/contacts/ (set in vite.config.js)

      - name: Verify dist output
        run: |
          echo "-- dist contents --"
          ls -la reactpress-app/dist/
          echo "-- dist/assets --"
          ls -la reactpress-app/dist/assets/ || true

      - name: Deploy dist to ReactPress directory via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASS }}
          protocol: ftps
          port: 21
          # Uploads ONLY the built dist/ contents to the ReactPress app directory.
          # The ReactPress plugin on WordPress will serve index.html from here.
          # Adjust the path if your WordPress install is in a subdirectory
          # (e.g., /public_html/website_a246e6a8/wp-content/reactpress/apps/contacts/).
          server-dir: /public_html/wp-content/reactpress/apps/contacts/
          local-dir: ./reactpress-app/dist/
          exclude: |
            **/.git*
            **/.github/**
            **/*.map
          dangerous-clean-slate: false
          log-level: verbose
          dry-run: false
          timeout: 60000

      - name: ReactPress deployment complete
        if: always()
        run: echo "✓ ReactPress app deployed to HostGator at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"